[project]
name = "captioner"
version = "0.7.0"
description = "Local-first AI captioning for Windows: batch SRT/VTT subtitles plus a live caption overlay, running fully offline on your own GPU."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "All rights reserved" }
keywords = ["whisper", "subtitles", "srt", "live-captions", "pyside6", "faster-whisper"]
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# The app is run from the checkout (see README); this file exists so tooling
# and packagers have one place to read metadata from. Runtime dependencies stay
# in requirements.txt because the install order there is deliberate: torch's
# CUDA index has to be installed before everything else.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# These files import after putting the project root on sys.path, which
# is the point of the file (so a bare `python <path>` run works).
"ui/dashboard/__init__.py" = ["E402"]
"tests/test_live.py" = ["E402"]
